[project]
name = "project"
version = "0.1.0"
description = "Learn AI development with Python"
readme = "README.md"
authors = [
    { name = "Theekshana Wijesinghe", email = "theekshana.wijesinghe@uzabase.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
